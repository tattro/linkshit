# Nightly database backup. The repo is public, so the dump is encrypted with
# BACKUP_PASSPHRASE before it is stored. Needs two repository secrets:
#   DATABASE_URL       the Neon connection string
#   BACKUP_PASSPHRASE  a long random password (keep a copy somewhere safe)
# Restore: download the artifact, then
#   gpg --decrypt linkshit.dump.gpg > linkshit.dump
#   pg_restore --no-owner --clean --if-exists -d "$DATABASE_URL" linkshit.dump
name: Nightly DB backup

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Add DATABASE_URL and BACKUP_PASSPHRASE repository secrets to enable backups."
            exit 1
          fi

      - name: Install Postgres 18 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18

      - name: Dump and encrypt
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          /usr/lib/postgresql/18/bin/pg_dump --format=custom --no-owner --no-privileges "$DATABASE_URL" \
            | gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase-fd 3 3<<<"$BACKUP_PASSPHRASE" -o linkshit.dump.gpg
          ls -lh linkshit.dump.gpg

      - uses: actions/upload-artifact@v4
        with:
          name: linkshit-db-${{ github.run_id }}
          path: linkshit.dump.gpg
          retention-days: 14
          if-no-files-found: error
